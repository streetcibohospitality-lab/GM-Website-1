name: GM Command Center QA

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Require reproducible dependency lock
        run: test -f package-lock.json || (echo "package-lock.json is required before release" && exit 1)
      - run: npm ci
      - run: npm run ci
